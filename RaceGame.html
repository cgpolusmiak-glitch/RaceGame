    row.className = 'brow' + (i === justPlayed ? ' me' : '');
    row.style.borderLeftColor = p.color;   // полоска цвета игрока слева

    const rank = document.createElement('span');
    rank.className = 'rank';
    rank.textContent = played ? (['🥇', '🥈', '🥉'][place] || (place + 1) + '.') : '–';
    if (played) place++;

    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = displayName(p);

    const sc = document.createElement('span');
    sc.className = 'sc';
    sc.textContent = played ? p.round : '—';

    const bs = document.createElement('span');
    bs.className = 'bs';
    bs.textContent = 'рекорд ' + p.best;

    row.append(rank, nm, sc, bs);
    boardEl.appendChild(row);
  });
}

/* =====================================================================
   ПЬЕДЕСТАЛ
   Когда в раунде сыграли все игроки, показываем пьедестал: тройка
   лучших стоит на ступенях, над головами медали, сверху сыплется
   конфетти, а герои подпрыгивают от радости. Победитель прыгает выше всех.
   ===================================================================== */
const podiumCanvas = document.getElementById('podiumCanvas');
const PODIUM_W = 320, PODIUM_H = 250;   // размер сцены в обычных пикселях (сам холст в два раза крупнее)
let podiumOn = false;    // рисуем ли пьедестал прямо сейчас
let podiumList = [];     // лучшие игроки по порядку: [{ p: игрок, score: очки }, ...]
let podiumT = 0;         // время анимации (секунды)
let confetti = [];       // конфетти

function initConfetti() {
  const colors = ['#f2c14e', '#d9534f', '#3b82c4', '#2e9e5b', '#8e5bc4', '#e08a1e'];
  confetti = [];
  for (let i = 0; i < 70; i++) {
    confetti.push({
      x: Math.random() * PODIUM_W, y: Math.random() * PODIUM_H,
      vx: (Math.random() - 0.5) * 30, vy: 40 + Math.random() * 60,   // сносит чуть вбок и тянет вниз
      s: 4 + Math.random() * 4, c: colors[i % colors.length]
    });
  }
  podiumT = 0;
}

// Показывает экран конца раунда. text — строка с результатом только что сыгравшего.
function showPodium(text) {
  // Порядок мест: по лучшему заходу в раунде (при равенстве — по личному рекорду)
  const order = players.map((p, i) => i).sort((a, b) =>
    (players[b].round - players[a].round) || (players[b].best - players[a].best));
  podiumList = order.slice(0, 3).map(i => ({ p: players[i], score: players[i].round }));
  initConfetti();

  const medals = ['🥇', '🥈', '🥉'];
  const names = podiumList.map((e, k) => medals[k] + ' ' + displayName(e.p));
  showOverlay('🏆 Конец раунда!', text + '\nПоздравляем: ' + names.join(', ') + '!', {
    podium: true, board: true,
    start: 'Новый раунд: ' + displayName(players[0]) + ' ▶',
    startIndex: 0,
    row: true, again: '', round: false,
    slider: micEnabled
  });
  renderBoard(current);   // таблицу строим сейчас, пока результаты ещё не обнулены

  // Раунд завершён: обнуляем его результаты (личные рекорды остаются),
  // поэтому в новом раунде на дорожке не будет старых маркеров
  players.forEach(p => { p.round = null; p.last = null; });
}

// Рисует медаль на шее героя: красная ленточка уголком и кружок цвета ступени.
// У героя с фото тело маленькое, а у квадратного герой большое, поэтому размеры разные.
function drawMedal(g, P, hx, hy, col) {
  const cx = hx + CONFIG.heroW / 2;
  // [где ленточка огибает шею, нижняя точка уголка, центр медали, радиус медали]
  const m = P.img ? [hy + 33, hy + 38, hy + 41, 6] : [hy + 17, hy + 29, hy + 34, 7];   // у квадратного героя медаль висит низко, у ног
  g.strokeStyle = (P.color === '#d9534f') ? '#ffffff' : '#d9534f';   // ленточка (на красном герое — белая)
  g.lineWidth = 3;
  g.beginPath();
  g.moveTo(cx - 9, m[0]); g.lineTo(cx, m[1]); g.lineTo(cx + 9, m[0]);
  g.stroke();
  g.fillStyle = col;                           // сама медаль с тёмной окантовкой
  g.strokeStyle = 'rgba(0, 0, 0, 0.45)';
  g.lineWidth = 1.5;
  g.beginPath();
  g.arc(cx, m[2], m[3], 0, Math.PI * 2);
  g.fill();
  g.stroke();
}

// Рисует пьедестал (вызывается каждый кадр, пока podiumOn = true)
function drawPodium(dt) {
  const g = podiumCanvas.getContext('2d'), W = PODIUM_W, H = PODIUM_H;
  podiumT += dt;
  g.setTransform(2, 0, 0, 2, 0, 0);          // холст в два раза крупнее для чёткости

  // Сцена: тёплый фон и пол
  const floorY = 215;
  g.fillStyle = '#fff3c9';
  g.fillRect(0, 0, W, H);
  g.fillStyle = '#e6cf8a';
  g.fillRect(0, floorY, W, H - floorY);

  // Ступени: [место (0 — первое), центр по горизонтали, высота, цвет]
  const slots = [[0, 160, 90, '#f2c14e'], [1, 70, 62, '#c9ced6'], [2, 250, 40, '#cd8b4b']];
  g.textAlign = 'center';
  for (const [place, cx, h, col] of slots) {
    const e = podiumList[place];
    if (!e) continue;                          // игроков меньше трёх — лишних ступеней нет
    const top = floorY - h;

    g.fillStyle = col;                         // ступень
    g.fillRect(cx - 44, top, 88, h);
    g.fillStyle = 'rgba(255, 255, 255, 0.35)'; // светлая верхняя грань
    g.fillRect(cx - 44, top, 88, 4);
    g.fillStyle = '#4a3b12';                   // имя и очки на ступени
    g.font = 'bold 13px system-ui, Arial';
    g.fillText(displayName(e.p), cx, top + 20, 80);
    g.font = '12px system-ui, Arial';
    g.fillText(String(e.score), cx, top + 35);

    // Герой подпрыгивает от радости: победитель выше всех
    const jump = Math.abs(Math.sin(podiumT * 5 + place * 1.3)) * (place === 0 ? 12 : 6);
    const hy = top - CONFIG.heroH - jump;
    drawCharacter(g, e.p, cx - CONFIG.heroW / 2, hy, 0, 0);

    drawMedal(g, e.p, cx - CONFIG.heroW / 2, hy, col);   // медаль на шее
  }

  // Конфетти: падает вниз и возвращается наверх
  for (const c of confetti) {
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    if (c.y > H) { c.y = -8; c.x = Math.random() * W; }
    g.fillStyle = c.c;
    g.fillRect(c.x, c.y, c.s, c.s * 0.6);
  }
}

/* =====================================================================
   МАГАЗИН НАРЯДОВ
   Монеты, собранные на трассе, можно потратить между играми: купить
   наряд из списка OUTFITS и надеть его (в каждой «ячейке» — один наряд).
   Купленное и надетое сохраняется вместе с игроком.
   ===================================================================== */
const shopBlock   = document.getElementById('shopBlock');
const shopCanvas  = document.getElementById('shopCanvas');
const shopList    = document.getElementById('shopList');
const btnShopBack = document.getElementById('btnShopBack');
const menuShop    = document.getElementById('menuShop');    // большая картинка магазина в меню
const btnShop2    = document.getElementById('btnShop2');    // маленькая кнопка на экране результатов
let shopPlayer = null;   // чей магазин сейчас открыт
let menuShopOn = false;  // рисуем ли вывеску магазина в меню прямо сейчас
let menuShopT = 0;       // время анимации вывески (секунды)

/* ---------- Картинки нарядов ----------
   Дети могут ещё не уметь читать, поэтому в магазине и на витрине наряды
   показаны картинками. Картинку наряда рисует та же функция drawOutfit,
   что и на герое, просто на «пустом» герое и в увеличенном виде.
   ICON_BOX — «рамка» каждого наряда в координатах героя: [x, y, ширина, высота].
   По ней картинка вписывается в квадрат нужного размера. */
const ICON_BOX = {
  cap:     [6, -9, 36, 16],
  bow:     [12, -9, 24, 19],
  party:   [9, -26, 22, 30],
  glasses: [14, 7, 24, 10],
  cape:    [-13, 5, 22, 35],
  wizard:  [-3, -27, 46, 33],
  crown:   [7, -18, 26, 23]
};

// Рисует наряд id в квадрат size × size с левым верхним углом (x, y)
function drawOutfitIcon(g, id, x, y, size) {
  const it = OUTFIT_BY_ID[id], b = ICON_BOX[id];
  if (!it || !b) return;
  const s = Math.min(size / b[2], size / b[3]);     // во сколько раз увеличить
  const dummy = { img: null, color: '#999', wear: { head: null, face: null, back: null } };
  dummy.wear[it.slot] = id;                         // «пустой» герой, на котором надет только этот наряд
  g.save();
  g.translate(x + size / 2 - (b[0] + b[2] / 2) * s, y + size / 2 - (b[1] + b[3] / 2) * s);
  g.scale(s, s);
  drawOutfit(g, dummy, 0, 0, 0, 0, it.slot === 'back' ? 'back' : 'front');
  g.restore();
}

function openShop() {
  shopPlayer = players[current];
  showOverlay('🛍 Магазин', '', { shop: true });
  renderShop();
}

function renderShop() {
  const P = shopPlayer;
  titleEl.textContent = '🛍 ' + displayName(P);
  textEl.textContent = '🪙 ' + P.coins;             // только число: слов в магазине почти нет
  textEl.classList.remove('hidden');

  // Предпросмотр: герой в нарядах (сцена 80×80, увеличенная в 3 раза)
  const g = shopCanvas.getContext('2d');
  g.setTransform(3, 0, 0, 3, 0, 0);
  g.fillStyle = '#fff3c9';
  g.fillRect(0, 0, 80, 80);
  g.fillStyle = '#e6cf8a';
  g.fillRect(0, 72, 80, 8);
  drawCharacter(g, P, 20, 22, 0, 0);

  // Витрина: у каждого наряда карточка с картинкой.
  //   не куплен — внизу цена в монетах (серая, если монет не хватает);
  //   куплен — цены нет, нажатие надевает или снимает;
  //   надет — зелёная рамка и галочка.
  shopList.innerHTML = '';
  for (const it of OUTFITS) {
    const owned = P.owned.includes(it.id);
    const worn = P.wear[it.slot] === it.id;

    const card = document.createElement('button');
    card.className = 'scard' + (worn ? ' worn' : '');
    card.setAttribute('aria-label', it.name);        // название остаётся для чтецов экрана
    card.disabled = !owned && P.coins < it.cost;     // не хватает монет — карточка серая

    const pic = document.createElement('canvas');
    pic.width = pic.height = 144;                    // в двойном размере для чёткости
    drawOutfitIcon(pic.getContext('2d'), it.id, 8, 8, 128);

    const price = document.createElement('span');
    price.className = 'price';
    price.textContent = worn ? '✅' : owned ? '' : '🪙 ' + it.cost;

    card.append(pic, price);
    card.addEventListener('click', () => {
      if (!owned) {
        if (P.coins < it.cost) return;
        P.coins -= it.cost;                          // покупаем и сразу надеваем
        P.owned.push(it.id);
        P.wear[it.slot] = it.id;
      } else {
        P.wear[it.slot] = worn ? null : it.id;       // надеть или снять
      }
      savePlayers();
      renderShop();
    });
    shopList.appendChild(card);
  }
}

/* ---------- Вывеска магазина в главном меню ----------
   Большая картинка (как пьедестал): полосатый навес, вывеска с монетой и
   числом монет игрока, полки с нарядами и сам герой в своих нарядах.
   Нажатие на картинку открывает магазин. Рисуется каждый кадр. */
function drawMenuShop(dt) {
  const P = players[current];
  const g = menuShop.getContext('2d'), W = 320, H = 200;
  menuShopT += dt;
  const t = menuShopT;
  g.setTransform(2, 0, 0, 2, 0, 0);                  // холст в два раза крупнее для чёткости

  // Фон и пол
  g.fillStyle = '#fff3c9';
  g.fillRect(0, 0, W, H);
  g.fillStyle = '#e6cf8a';
  g.fillRect(0, 172, W, H - 172);

  // Стена магазина и шкаф с двумя полками
  g.fillStyle = '#f7d9a0';
  g.fillRect(18, 56, 284, 116);
  g.fillStyle = '#b98a55';
  g.fillRect(30, 74, 182, 96);
  g.fillStyle = '#e4c08a';
  g.fillRect(34, 78, 174, 88);
  g.fillStyle = '#b98a55';
  g.fillRect(34, 118, 174, 4);                       // верхняя полка
  g.fillRect(34, 162, 174, 4);                       // нижняя полка

  // Наряды на полках: четыре сверху, остальные снизу, а следом блестящая монета
  OUTFITS.forEach((it, k) => {
    const col = k % 4, row = Math.floor(k / 4);
    drawOutfitIcon(g, it.id, 41 + col * 44, row ? 128 : 86, 30);
  });
  const nextSlot = OUTFITS.length;
  if (nextSlot < 8) {
    const col = nextSlot % 4, row = Math.floor(nextSlot / 4);
    drawCoinShape(g, 56 + col * 44, (row ? 143 : 101), 10, 0.3 + 0.7 * Math.abs(Math.cos(t * 3)));
  }

  // Герой игрока (в своих нарядах) слегка подпрыгивает перед магазином
  const bounce = Math.abs(Math.sin(t * 3)) * 4;
  drawCharacter(g, P, 237, 172 - CONFIG.heroH - bounce, 0, 0);

  // Навес: красно-белые полосы с лёгким покачиванием
  g.fillStyle = '#8a5a2b';
  g.fillRect(6, 30, 308, 7);
  const n = 8, sw = 300 / n;
  for (let i = 0; i < n; i++) {
    const x = 10 + i * sw;
    g.fillStyle = (i % 2) ? '#ffffff' : '#d9534f';
    g.fillRect(x, 37, sw, 20);
    g.beginPath();
    g.arc(x + sw / 2, 57 + Math.sin(t * 2 + i) * 1.2, sw / 2, 0, Math.PI);   // закруглённый край
    g.fill();
  }

  // Вывеска сверху: монета и число монет игрока
  g.fillStyle = '#ffffff';
  g.fillRect(112, 2, 96, 26);
  g.strokeStyle = '#8a5a2b';
  g.lineWidth = 2;
  g.strokeRect(112, 2, 96, 26);
  drawCoinShape(g, 132, 15, 8, 0.3 + 0.7 * Math.abs(Math.cos(t * 3)));
  g.fillStyle = '#4a3b12';
  g.font = 'bold 18px system-ui, Arial';
  g.textAlign = 'left';
  g.textBaseline = 'middle';
  g.fillText(String(P.coins), 146, 16, 56);

  // Золотая рамка мягко мигает: подсказка, что картинку можно нажать
  g.strokeStyle = 'rgba(242, 193, 78, ' + (0.45 + 0.45 * Math.sin(t * 4)) + ')';
  g.lineWidth = 4;
  g.strokeRect(2, 2, W - 4, H - 4);
}

menuShop.addEventListener('click', openShop);
btnShop2.addEventListener('click', openShop);
btnShopBack.addEventListener('click', () => showMenu(false));

// Главная кнопка: «Играть», «Дальше: Имя», «Играть снова»
btnStart.addEventListener('click', async () => {
  current = startIndex;   // выбираем, кто играет

  // Способ управления уже выбран раньше (микрофон или касание) — просто стартуем
  if (modeChosen) { startGame(); return; }

  // Иначе первый запуск: просим микрофон
  await enableMic();
});

// Просим доступ к микрофону и, если он есть, замеряем фоновый шум.
// Её же вызывает кнопка «Играть голосом», если раньше выбрали игру касанием.
async function enableMic() {
  showOverlay('Микрофон', 'Разрешите доступ к микрофону в окошке браузера…', {});
  const ok = await setupMic();
  if (ok) {
    micEnabled = true;
    modeChosen = true;
    startCalibration();
  } else {
    showOverlay('Нет доступа к микрофону',
      'Проверьте разрешение в настройках браузера.\nИгра должна быть открыта по HTTPS-ссылке (не как файл) и в самом браузере, а не из мессенджера.\nМожно играть касанием экрана.' +
      (micError ? '\n(причина: ' + micError + ')' : ''),
      { start: 'Попробовать ещё раз', tap: true });
  }
}

btnMic.addEventListener('click', async () => { current = startIndex; await enableMic(); });

// «Ещё раз»: тот же игрок пробует снова
btnAgain.addEventListener('click', () => startGame());

// «Новый раунд»: стираем результаты последних игр (личные рекорды остаются)
btnRound.addEventListener('click', () => {
  players.forEach(p => { p.last = null; p.round = null; });
  renderBoard(-1);
  btnRound.classList.add('hidden');
});

// «Игроки»: открываем экран выбора и редактирования игроков
btnPlayers.addEventListener('click', () => showMenu(false));

// Нажали «Откалибровать заново»
btnCalib.addEventListener('click', () => { audioCtx.resume(); startCalibration(); });

// Нажали «Играть касанием»
btnTap.addEventListener('click', () => { micEnabled = false; modeChosen = true; startGame(); });

// Двигаем ползунок — меняется порог громкости
slider.addEventListener('input', () => {
  threshold = slider.value / 1000;
  sliderVal.textContent = threshold.toFixed(3);
});

/* =====================================================================
   ГЛАВНЫЙ ЦИКЛ
   requestAnimationFrame вызывает нашу функцию перед каждой перерисовкой
   экрана (обычно 60 раз в секунду) — это и есть «сердце» игры.
   ===================================================================== */
// Индикатор громкости в меню: полоска показывает, что слышит микрофон (хлопните или крикните,
// чтобы проверить), а чёрточка — порог прыжка. Если звука нет совсем, пишет подсказку.
let zeroFrames = 0;   // сколько кадров подряд громкость была ровно нулевой
function updateMeter() {
  if (!micEnabled || overlay.classList.contains('hidden')) { zeroFrames = 0; return; }
  const full = 0.3;   // громкость, при которой полоска заполнена
  meterFill.style.width = (Math.min(1, level / full) * 100) + '%';
  meterFill.classList.toggle('hot', level > threshold);
  meterMark.style.left = (Math.min(1, threshold / full) * 100) + '%';
  zeroFrames = (level === 0) ? zeroFrames + 1 : 0;
  micStatus.textContent = (audioCtx && audioCtx.state !== 'running') ? '⚠ Звук приостановлен: коснитесь экрана'
    : zeroFrames > 120 ? '⚠ Микрофон ничего не слышит: проверьте разрешение и не закрыт ли он пальцем' : '';
}

let lastTime = performance.now();

function loop(now) {
  // Сколько секунд прошло с прошлого кадра (не больше 0.05, чтобы после
  // переключения вкладки герой не «телепортировался»)
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  if (state === 'calibrating') updateCalibration();
  else update(dt);

  draw();
  updateMeter();                      // индикатор громкости в меню
  if (menuShopOn) drawMenuShop(dt);   // вывеска магазина в меню (она слегка анимирована)
  if (podiumOn) drawPodium(dt);   // анимация пьедестала, когда он на экране
  requestAnimationFrame(loop);
}

/* =====================================================================
   ЗАПУСК
   ===================================================================== */
// Включаем работу без интернета: сервис-воркер (файл sw.js) сохраняет игру в память телефона.
// Если файла нет или браузер его не поддерживает, игра просто работает как обычная страница.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

loadPlayers();
slider.value = Math.round(threshold * 1000);
showMenu(true);
requestAnimationFrame(loop);

/* =====================================================================
   РАБОТА БЕЗ ИНТЕРНЕТА
   Сервис-воркер (файл sw.js) при первом открытии сохраняет игру в память
   телефона. Дальше она открывается и без сети. Работает только по https
   (на GitHub Pages так и есть); если файла sw.js рядом нет, игра просто
   работает как обычная страница.
   ===================================================================== */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
